# fly.toml app configuration file generated for heartmed-backend on 2026-11-14T18:08:35-05:00
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'heartmed-backend'
primary_region = 'iad'

[build]
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[mounts]]
  source = 'heartmed_data'
  destination = '/data'

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
